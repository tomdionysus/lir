#
# tools/ci.sh's steps on Debian 13, as the nodes have it: the header and format
# check; release builds on x86-64 and on arm64, as a build node builds them; clang with
# its thread-safety analysis; ASan and UBSan on both, TSan; the libFuzzer
# targets; the installed package and its consumer; the Debian packages on
# both, lintian clean; coverage to Codecov; and a build and test on macOS. Runs on the build servers and the
# standing cluster stay by hand.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: client, arch: x86-64, runner: ubuntu-24.04 }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: asan, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: tsan, arch: x86-64, runner: ubuntu-24.04 }
          - { step: fuzz, arch: x86-64, runner: ubuntu-24.04 }
          - { step: package, arch: x86-64, runner: ubuntu-24.04 }
    env:
      # Each fuzz target's time on a push; a release runs them longer by hand.
      LIR_FUZZ_SECONDS: 60
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format cmake ninja-build git ca-certificates openssl mosquitto-clients \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev \
            libclang-rt-19-dev  # clang's sanitizer and libFuzzer runtimes

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  # The Debian packages, on both architectures (arm64 as a build node builds them),
  # against Dannan's packages built from its tag: the tests run inside the
  # build, and lintian fails them on any error or warning.
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev lintian git ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the package's version

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: deb
        run: tools/ci.sh deb

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl mosquitto-clients \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # The image's default Xcode has a libc++ without std::jthread and
      # std::stop_token; the newest installed has them, as a current Mac does.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install packages
        run: brew install boost openssl@3 yaml-cpp googletest ninja mosquitto

      - uses: actions/checkout@v4

      # Homebrew's own include directory, which Boost's path brings in, holds
      # OpenSSL 4 (the stack builds against 3, as Debian has it). A directory
      # with only OpenSSL 3's headers goes first, still read as system headers.
      - name: Build
        run: |
          ssl="$(brew --prefix openssl@3)"
          mkdir -p build/ssl3-include
          ln -sfn "$ssl/include/openssl" build/ssl3-include/openssl
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIR_BUILD_TESTING=ON -DLIR_WARNINGS_AS_ERRORS=ON \
            -DLIR_DANNAN_REPOSITORY=https://github.com/tomdionysus/dannan.git \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DOPENSSL_ROOT_DIR="$ssl" \
            -DCMAKE_CXX_FLAGS="-I$PWD/build/ssl3-include --system-header-prefix=openssl/"
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: build/lir_tests
